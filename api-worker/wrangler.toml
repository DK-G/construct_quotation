name = "construct-quotation-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"

[vars]
# You can place public variables here, but secrets must be added via wrangler secret

# --- D1: フィードバックログ永続化 & マスタ辞書オーバーライド ---
# 初回セットアップ手順:
#   1. npx wrangler d1 create construct-quotation-db
#   2. 出力された database_id で下記プレースホルダを置き換える
#   3. npx wrangler d1 execute construct-quotation-db --remote --file=./schema.sql
# ※ バインディングが未設定でも API は従来どおり動作する（永続化のみスキップされる）
[[d1_databases]]
binding = "DB"
database_name = "construct-quotation-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
